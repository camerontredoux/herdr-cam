<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" width="240" height="140">
  <!-- The Cam layout: a thin top strip, the spaces sidebar card, the work card
       (tab pills, a terminal, a status bar), on the canvas. -->
  <rect width="240" height="140" rx="8" fill="#121212"/>
  <!-- Top strip: traffic lights, sidebar and search buttons. -->
  <circle cx="9" cy="7" r="2" fill="#ec6a5e"/>
  <circle cx="16" cy="7" r="2" fill="#f4bf4f"/>
  <circle cx="23" cy="7" r="2" fill="#61c554"/>
  <rect x="31" y="4.5" width="6" height="5" rx="1.2" fill="none" stroke="#7a7a7a" stroke-width="0.9"/>
  <line x1="33.2" y1="4.5" x2="33.2" y2="9.5" stroke="#7a7a7a" stroke-width="0.9"/>
  <circle cx="43" cy="6.7" r="1.8" fill="none" stroke="#7a7a7a" stroke-width="0.9"/>
  <line x1="44.3" y1="8" x2="45.6" y2="9.3" stroke="#7a7a7a" stroke-width="0.9"/>

  <!-- Sidebar card. -->
  <rect x="3" y="13" width="62" height="124" rx="4" fill="#1b1b1b" stroke="#2c2c2c"/>
  <rect x="8" y="17" width="16" height="2.5" rx="1.2" fill="#555"/>
  <rect x="57" y="17" width="4" height="2.5" rx="1" fill="#555"/>
  <!-- Spaces: colored marks, the active one selected. -->
  <rect x="6" y="24" width="56" height="9" rx="2.5" fill="#2a2a2a"/>
  <rect x="8" y="25.5" width="6" height="6" rx="1.5" fill="#22a99a"/>
  <rect x="17" y="27.4" width="26" height="2.4" rx="1.2" fill="#d8d8d8"/>
  <rect x="8" y="36.5" width="6" height="6" rx="1.5" fill="#e3814f"/>
  <rect x="17" y="38.4" width="32" height="2.4" rx="1.2" fill="#8a8a8a"/>
  <rect x="8" y="46.5" width="6" height="6" rx="1.5" fill="#5b8def"/>
  <rect x="17" y="48.4" width="20" height="2.4" rx="1.2" fill="#8a8a8a"/>
  <rect x="8" y="56.5" width="6" height="6" rx="1.5" fill="#8b7cf6"/>
  <rect x="17" y="58.4" width="28" height="2.4" rx="1.2" fill="#8a8a8a"/>
  <!-- Settings at the foot. -->
  <line x1="3.5" y1="127" x2="64.5" y2="127" stroke="#2c2c2c"/>
  <circle cx="11" cy="132" r="2" fill="none" stroke="#7a7a7a" stroke-width="0.9"/>
  <rect x="17" y="130.8" width="18" height="2.4" rx="1.2" fill="#8a8a8a"/>

  <!-- Work card. -->
  <rect x="69" y="13" width="168" height="124" rx="4" fill="#1b1b1b" stroke="#2c2c2c"/>
  <!-- Tab pills. -->
  <rect x="73" y="16.5" width="28" height="8" rx="2.5" fill="#2a2a2a" stroke="#3a3a3a" stroke-width="0.6"/>
  <rect x="75.5" y="19" width="3" height="3" rx="0.8" fill="#e3814f"/>
  <rect x="81" y="19.6" width="16" height="1.8" rx="0.9" fill="#d8d8d8"/>
  <rect x="104" y="17.5" width="22" height="6" rx="2" fill="#1b1b1b"/>
  <rect x="107" y="19.6" width="16" height="1.8" rx="0.9" fill="#6a6a6a"/>
  <rect x="228" y="19" width="4" height="3" rx="0.8" fill="#6a6a6a"/>
  <line x1="69.5" y1="28" x2="236.5" y2="28" stroke="#2c2c2c"/>
  <!-- Terminal pane, focused. -->
  <rect x="72" y="31" width="162" height="92" rx="1.5" fill="#141414" stroke="#e3a35b" stroke-width="0.8"/>
  <rect x="72.4" y="31.4" width="161.2" height="7" fill="#1f1f1f"/>
  <rect x="76" y="33.6" width="30" height="2.2" rx="1.1" fill="#6a6a6a"/>
  <rect x="77" y="44" width="56" height="2.4" rx="1.2" fill="#9ccfa0"/>
  <rect x="77" y="50" width="88" height="2.4" rx="1.2" fill="#8a8a8a"/>
  <rect x="77" y="56" width="70" height="2.4" rx="1.2" fill="#8a8a8a"/>
  <rect x="77" y="62" width="44" height="2.4" rx="1.2" fill="#c792ea"/>
  <rect x="77" y="68" width="96" height="2.4" rx="1.2" fill="#8a8a8a"/>
  <rect x="77" y="74" width="60" height="2.4" rx="1.2" fill="#8a8a8a"/>
  <rect x="77" y="84" width="4" height="4" fill="#e9b8c4"/>
  <!-- Status bar. -->
  <line x1="69.5" y1="127" x2="236.5" y2="127" stroke="#2c2c2c"/>
  <rect x="75" y="130.8" width="24" height="2.4" rx="1.2" fill="#6a6a6a"/>
  <rect x="104" y="130.8" width="18" height="2.4" rx="1.2" fill="#6a6a6a"/>
  <rect x="208" y="130.8" width="24" height="2.4" rx="1.2" fill="#555"/>
</svg>
